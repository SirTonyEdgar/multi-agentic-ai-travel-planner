services:
  # --- Vector database untuk memori percakapan Orchestrator ---
  - type: web
    name: chromadb
    runtime: image
    image:
      url: chromadb/chroma:latest
    plan: free
    healthCheckPath: /api/v1/heartbeat

  # --- Sumber data ground truth (flights/hotels/activities/transport) ---
  - type: web
    name: mock-api
    runtime: docker
    rootDir: backend/mock-api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /

  # --- Proxy + verifikator data antara Orchestrator dan Mock API ---
  - type: web
    name: integration-service
    runtime: docker
    rootDir: backend/integration-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: MOCK_API_URL
        fromService:
          name: mock-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # --- Inti sistem: LangChain agent + LLM ---
  - type: web
    name: orchestrator-service
    runtime: docker
    rootDir: backend/orchestrator-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: INTEGRATION_URL
        fromService:
          name: integration-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CHROMA_HOST
        fromService:
          name: chromadb
          type: web
          property: host
      - key: CHROMA_PORT
        value: 443
      - key: CHROMA_SSL
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: GOOGLE_API_KEY
        sync: false   # diisi manual lewat Render Dashboard, jangan taruh di sini/di git

  # --- Satu-satunya pintu masuk publik untuk request dari frontend ---
  - type: web
    name: api-gateway
    runtime: docker
    rootDir: backend/api-gateway
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: ORCHESTRATOR_URL
        fromService:
          name: orchestrator-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGINS
        value: "*"   # disederhanakan untuk demo portofolio; tidak ada cookie/auth di alur ini

  # --- Frontend: halaman perencana perjalanan ---
  - type: web
    name: frontend-jalan
    runtime: static
    rootDir: frontend-jalan
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: api-gateway
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_PESAN_URL
        fromService:
          name: frontend-pesan
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Frontend: halaman pemesanan hotel ---
  - type: web
    name: frontend-pesan
    runtime: static
    rootDir: frontend-pesan
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_JALAN_URL
        fromService:
          name: frontend-jalan
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
